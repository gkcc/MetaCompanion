[package]
name = "metacompanion-solver"
version = "0.1.0"
edition = "2024"
description = "Fail-closed Rust rules and search core for MetaCompanion"
license = "MIT"

[lib]
name = "metacompanion_solver"
path = "src/lib.rs"

[[bin]]
name = "metacompanion-solver"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
html-escape = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tiny_http = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
